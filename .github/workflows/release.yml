name: Release

# Published GitHub Release: build and upload raw pqcap binaries per platform.
# workflow_dispatch: same, for an existing tag (overwrites assets via --clobber).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and overwrite (e.g. v0.1.0-rc1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  validate-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verify release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          test -n "${TAG}"
          gh release view "${TAG}" --repo "${{ github.repository }}"

  build-and-upload:
    needs: validate-tag
    if: ${{ always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset_name: pqcap-linux-amd64
            install_linux_deps: true
            cc: ccache gcc
            cxx: ccache g++
          - runner: macos-14
            asset_name: pqcap-macos-arm64
            install_linux_deps: false
            cc: ccache clang
            cxx: ccache clang++

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      GEN: ninja

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: Install Linux build dependencies
        if: matrix.install_linux_deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache cmake ninja-build

      - name: Install macOS build tools
        if: ${{ !matrix.install_linux_deps }}
        run: brew install ccache cmake ninja

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache --set-config=max_size=2G
          ccache --zero-stats || true

      - name: Build pqcap CLI
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make pqcap-cli

      - name: Smoke test CLI
        run: bash tests/cli/smoke.sh

      - name: Stage release binary
        run: bash scripts/package_pqcap_cli_release.sh "${{ matrix.asset_name }}"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" \
            "${{ matrix.asset_name }}" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true
