name: Release

# Runs when a GitHub Release is published. Builds pqcap per platform and
# uploads raw binaries directly to that release (no zip, no Actions artifacts).

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset_name: pqcap-linux-amd64
            install_linux_deps: true
            cc: ccache gcc
            cxx: ccache g++
          - runner: macos-14
            asset_name: pqcap-macos-arm64
            install_linux_deps: false
            cc: ccache clang
            cxx: ccache clang++

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GEN: ninja

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Install Linux build dependencies
        if: matrix.install_linux_deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache cmake ninja-build

      - name: Install macOS build tools
        if: ${{ !matrix.install_linux_deps }}
        run: brew install ccache cmake ninja

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache --set-config=max_size=2G
          ccache --zero-stats || true

      - name: Build pqcap CLI
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make pqcap-cli

      - name: Smoke test CLI
        # Uses tests/fixtures/demo.pqcapng only (no text2pcap/tshark).
        run: bash tests/cli/smoke.sh

      - name: Stage release binary
        run: bash scripts/package_pqcap_cli_release.sh "${{ matrix.asset_name }}"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "${{ matrix.asset_name }}" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true
