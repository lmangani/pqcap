name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            ninja-build \
            tshark

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache --set-config=max_size=1G
          ccache --zero-stats || true
          ccache --show-config || true

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install duckdb pyarrow

      - name: Provide duckdb CLI wrapper
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/duckdb" <<'EOF'
          #!/usr/bin/env bash
          python3 - "$@" <<'PY'
          import argparse
          import csv
          import sys
          import duckdb

          def split_sql_statements(sql: str):
              stmts = []
              cur = []
              in_single = False
              in_double = False
              i = 0
              while i < len(sql):
                  ch = sql[i]
                  if ch == "'" and not in_double:
                      in_single = not in_single
                      cur.append(ch)
                  elif ch == '"' and not in_single:
                      in_double = not in_double
                      cur.append(ch)
                  elif ch == ";" and not in_single and not in_double:
                      stmt = "".join(cur).strip()
                      if stmt:
                          stmts.append(stmt)
                      cur = []
                  else:
                      cur.append(ch)
                  i += 1
              tail = "".join(cur).strip()
              if tail:
                  stmts.append(tail)
              return stmts

          def main():
              parser = argparse.ArgumentParser(add_help=False)
              parser.add_argument("-c", dest="command")
              parser.add_argument("-csv", action="store_true", dest="csv_out")
              parser.add_argument("-unsigned", action="store_true", dest="unsigned")
              parser.add_argument("--", dest="rest", nargs="*")
              args, _unknown = parser.parse_known_args(sys.argv[1:])

              con = duckdb.connect()
              sql = args.command if args.command is not None else sys.stdin.read()
              if not sql.strip():
                  return 0

              statements = split_sql_statements(sql)
              if not statements:
                  return 0

              rel = None
              for stmt in statements:
                  rel = con.execute(stmt)

              if rel is None:
                  return 0

              rows = rel.fetchall()
              cols = [d[0] for d in rel.description] if rel.description else []

              if args.csv_out:
                  out = csv.writer(sys.stdout)
                  if cols:
                      out.writerow(cols)
                  out.writerows(rows)
              else:
                  if cols:
                      sys.stdout.write("\t".join(cols) + "\n")
                  for row in rows:
                      sys.stdout.write("\t".join("" if v is None else str(v) for v in row) + "\n")
              return 0

          raise SystemExit(main())
          PY
          EOF
          chmod +x "$HOME/.local/bin/duckdb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run release check
        env:
          CC: "ccache gcc"
          CXX: "ccache g++"
        run: make release-check

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true
